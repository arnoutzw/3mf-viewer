<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Bambu 3MF Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace']
        }
      }
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; width: 100vw; }
    #viewer-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* Drop zone transitions */
    #drop-zone { transition: opacity 0.3s; }
    #drop-zone.hidden { opacity: 0; pointer-events: none; }
    #drop-zone.drag-over { background: rgba(245, 158, 11, 0.04) !important; }
    #drop-zone.drag-over .drop-ring { border-color: #f59e0b; box-shadow: 0 0 40px rgba(245,158,11,0.15); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }

    /* Plate item states */
    .plate-item { transition: all 0.15s; border-left: 3px solid transparent; }
    .plate-item:hover { background: rgba(255,255,255,0.03); }
    .plate-item.active { background: rgba(245,158,11,0.08); border-left-color: #f59e0b; }

    /* Toolbar button states */
    .tb-btn { transition: all 0.15s; }
    .tb-btn:hover { background: rgba(255,255,255,0.06); }
    .tb-btn:hover svg { color: #f4f4f5; }
    .tb-btn.active svg { color: #f59e0b; }
    .tb-btn .tooltip { transition: opacity 0.15s; }
    .tb-btn:hover .tooltip { opacity: 1; }

    /* Model name display toggle */
    .model-name-hidden { display: none !important; }

    /* Color input swatch */
    .obj-color { -webkit-appearance: none; appearance: none; border: none; }
    .obj-color::-webkit-color-swatch-wrapper { padding: 0; }
    .obj-color::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; }

    /* Range slider track */
    input[type=range] { -webkit-appearance: none; appearance: none; background: #27272a; border-radius: 4px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #f59e0b; cursor: pointer; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans">

<!-- ── Drop Zone ── -->
<div id="drop-zone" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-zinc-950/[.97] backdrop-blur-sm">
  <div class="drop-ring w-44 h-44 border-[3px] border-dashed border-zinc-700 rounded-full flex items-center justify-center mb-6" style="transition: all 0.3s">
    <svg class="w-14 h-14 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
  </div>
  <h2 class="font-mono font-bold text-xl text-amber-500 mb-2">Drop a .3mf file</h2>
  <p class="text-zinc-500 text-sm font-mono mb-5">Bambu Lab 3MF viewer &middot; works offline</p>
  <button class="bg-amber-500 hover:bg-amber-400 text-zinc-900 font-mono font-bold px-6 py-2.5 rounded-lg transition-colors cursor-pointer" id="browse-btn">Open File</button>
  <input type="file" id="file-input" accept=".3mf" hidden>
</div>

<!-- ── Loading Overlay ── -->
<div id="loading-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[2000] hidden items-center justify-center flex-col">
  <div class="spinner w-11 h-11 border-[3px] border-zinc-700 border-t-amber-500 rounded-full mb-4"></div>
  <div id="loading-text" class="text-sm text-zinc-500 font-mono">Loading model...</div>
  <div class="w-48 h-1 bg-zinc-800 rounded-full mt-4 overflow-hidden">
    <div id="loading-bar" class="h-full bg-amber-500 rounded-full transition-all duration-300 ease-out" style="width:0%"></div>
  </div>
</div>

<!-- ── Canvas ── -->
<canvas id="viewer-canvas"></canvas>

<!-- ── Top Bar ── -->
<div id="top-bar" class="fixed top-4 left-4 right-4 flex items-center justify-between z-[100] pointer-events-none">

  <div class="pointer-events-auto flex items-center gap-2">
    <button id="bambu-btn" class="model-name-hidden bg-zinc-900 border border-zinc-700 hover:border-green-500/50 text-zinc-400 hover:text-green-400 px-3 py-1.5 rounded-lg text-xs font-mono flex items-center gap-1.5 transition-colors cursor-pointer" title="Open in Bambu Studio">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M9 12l2 2 4-4"/></svg>
      Bambu Studio
    </button>
    <button id="open-btn" class="model-name-hidden bg-zinc-900 border border-zinc-700 hover:border-amber-500/50 text-zinc-400 hover:text-amber-400 px-3 py-1.5 rounded-lg text-xs font-mono flex items-center gap-1.5 transition-colors cursor-pointer">

</div>

<!-- ── Plate Sidebar ── -->
<div id="plate-sidebar" class="fixed top-[60px] left-4 bottom-[76px] w-[210px] bg-zinc-900 border border-zinc-700 rounded-lg overflow-y-auto z-[100] hidden">

</div>

<!-- ── Objects Panel (right sidebar) ── -->

<!-- ── Model Info ── -->

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

// ─── State ───
const BED_W = 256, BED_D = 256; // Bambu X1C build plate (mm)
const BED_PAD = 5;              // keep 5mm from edges
let scene, camera, renderer, controls;
let modelGroup = null;
let bedGroup = null;
let plates = [];
let activePlateIndex = 0;
let wireframeMode = false;
let bedVisible = true;
let modelCenter = new THREE.Vector3();
let modelSize = new THREE.Vector3();
let cameraDistance = 300;
let selectedMesh = null;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Material density database (g/cm³)
const MATERIALS = [
  { name: 'PLA',           density: 1.24 },
  { name: 'PLA+',          density: 1.24 },
  { name: 'PLA Silk',      density: 1.24 },
  { name: 'PETG',          density: 1.27 },
  { name: 'ABS',           density: 1.04 },
  { name: 'ASA',           density: 1.07 },
  { name: 'TPU 95A',       density: 1.21 },
  { name: 'PA (Nylon)',    density: 1.14 },
  { name: 'PA-CF',         density: 1.36 },
  { name: 'PLA-CF',        density: 1.29 },
  { name: 'PETG-CF',       density: 1.35 },
  { name: 'PC',            density: 1.20 },
  { name: 'PVA',           density: 1.19 },
  { name: 'HIPS',          density: 1.04 },
];
let selectedMaterialIdx = 0;
let hasFilamentData = false; // true when 3MF provides per-object filament info
let loadedFile = null; // store the loaded File for "Open in Bambu Studio"
let infillPercent = 20;    // default 20% infill
let wallCount = 3;         // number of perimeter walls
let nozzleDia = 0.4;       // nozzle diameter mm
let topBottomLayers = 4;   // top/bottom solid layers
let layerHeight = 0.2;     // mm

// ─── DOM ───
const canvas = document.getElementById('viewer-canvas');
const dropZone = document.getElementById('drop-zone');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');
const modelNameEl = document.getElementById('model-name');
const modelNameText = document.getElementById('model-name-text');
const plateSidebar = document.getElementById('plate-sidebar');
const plateList = document.getElementById('plate-list');
const objectsPanel = document.getElementById('objects-panel');
const objectList = document.getElementById('object-list');
const materialSelect = document.getElementById('material-select');
const weightInfo = document.getElementById('weight-info');
const modelInfo = document.getElementById('model-info');
const bottomBar = document.getElementById('bottom-bar');
const openBtn = document.getElementById('open-btn');
const fileInput = document.getElementById('file-input');

// ─── Init ───
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111); // near-black, matching loading screen

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
  camera.position.set(200, 200, 200);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
  dirLight.position.set(150, 300, 200);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 1500;
  dirLight.shadow.camera.left = -400;
  dirLight.shadow.camera.right = 400;
  dirLight.shadow.camera.top = 400;
  dirLight.shadow.camera.bottom = -400;
  dirLight.shadow.bias = -0.0005;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xaaccff, 0.35);
  fillLight.position.set(-100, 50, -100);
  scene.add(fillLight);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.3));

  // Controls
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.8;
  controls.panSpeed = 0.6;
  controls.minDistance = 10;
  controls.maxDistance = 2000;

  createBed(256, 256);
  window.addEventListener('resize', onResize);
  animate();

function decodeBedGeometry() {
  const bin = atob(BED_STL_B64);
  const buf = new ArrayBuffer(bin.length);
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const positions = new Float32Array(buf);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  // STL uses X/Y for plate surface, Z for height — rotate so Y is up
  geometry.rotateX(-Math.PI / 2);
  geometry.computeBoundingBox();
  const box = geometry.boundingBox;
  const cx = (box.min.x + box.max.x) / 2;
  const cz = (box.min.z + box.max.z) / 2;
  // Center XZ and push down so top surface sits at Y=0
  geometry.translate(-cx, -box.max.y, -cz);
  geometry.computeVertexNormals();
  return geometry;
}

function createBed(w, d) {
  bedGroup = new THREE.Group();

  const bedMat = new THREE.MeshStandardMaterial({
    color: 0x4a4a4a, metalness: 0.02, roughness: 0.98 // mid-dark grey, matte supertack
  });

  // Decode embedded buildplate geometry (no fetch needed — works offline & file://)
  const bedGeo = decodeBedGeometry();
  const plateMesh = new THREE.Mesh(bedGeo, bedMat);
  plateMesh.receiveShadow = true;
  bedGroup.add(plateMesh);

  // Grid overlay
  const grid = new THREE.GridHelper(Math.max(w, d), Math.max(w, d) / 10, 0x52525b, 0x3f3f46);
  grid.position.y = 0.05;
  bedGroup.add(grid);

  scene.add(bedGroup);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ─── 3MF Loading (custom Bambu-aware parser) ───
async function load3MF(file) {
  loadedFile = file;
  showLoading('Reading ' + file.name + '...', 0);
  dropZone.classList.add('hidden');

  try {
    const arrayBuffer = await file.arrayBuffer();
    showLoading('Parsing 3MF...', 5);

    let object;
    const onProgress = (msg, pct) => showLoading(msg, pct);
    // Always try custom Bambu parser first — it handles Bambu-specific
    // displaycolor, partnumber plates, and component assemblies correctly.
    // Three's ThreeMFLoader silently drops these, defaulting all colors.
    try {
      object = await parseBambu3MF(arrayBuffer, onProgress);
    } catch (e) {
      console.warn('Bambu parser failed, trying ThreeMFLoader:', e.message);
      try {
        const loader = new ThreeMFLoader();
        object = loader.parse(arrayBuffer);
      } catch (e2) {
        throw new Error('Both parsers failed: ' + e.message);
      }
    }

    if (!object) throw new Error('Could not parse 3MF');
    showLoading('Laying out plates...', 95);
    processModel(object, file.name);
  } catch (err) {
    console.error('Load error:', err);
    showLoading('Error: ' + err.message);
    setTimeout(() => { hideLoading(); dropZone.classList.remove('hidden'); }, 3000);
  }
}

// Normalize color strings from 3MF files.
// Bambu uses 8-char hex with alpha (#RRGGBBAA) which Three.js cannot parse.
// Strip alpha channel and handle edge cases.
function parseColor(colorStr) {
  if (!colorStr || typeof colorStr !== 'string') return new THREE.Color(0xf59e0b);
  let s = colorStr.trim();
  // #RRGGBBAA → #RRGGBB (strip alpha)
  if (s.match(/^#[0-9a-f]{8}$/i)) s = s.slice(0, 7);
  // #RGBA → #RGB (strip alpha from short form)
  if (s.match(/^#[0-9a-f]{4}$/i)) s = s.slice(0, 4);
  try {
    return new THREE.Color(s);
  } catch (e) {
    console.warn('Could not parse color:', colorStr);
    return new THREE.Color(0xf59e0b);
  }
}

async function parseBambu3MF(buffer, onProgress) {
  const progress = async (msg, pct) => {
    if (onProgress) onProgress(msg, pct);
    await new Promise(r => setTimeout(r, 0)); // yield to browser for repaint
  };
  await progress('Decompressing ZIP...', 10);
  const fflate = await import('https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js');
  const data = new Uint8Array(buffer);
  const unzipped = fflate.unzipSync(data);

  const group = new THREE.Group();
  const plateGroups = new Map();
  const files = Object.keys(unzipped);
  const modelFiles = files.filter(f => f.endsWith('.model'));
  const stlFiles = files.filter(f => f.toLowerCase().endsWith('.stl'));

  // ── Bambu color system: extruder-based ──
  // Bambu stores colors NOT in standard 3MF basematerials, but via:
  //   1. project_settings.config (JSON) → filament_colour array (per extruder slot)
  //   2. model_settings.config (XML) → <object id="N"><metadata key="extruder" value="M"/>
  // We parse both to build objectId → color mapping.

  await progress('Reading filament config...', 20);
  // Step A: Extract filament colors and material info from project_settings.config
  let filamentColors = []; // index 0 = extruder 1, etc.
  let filamentMaterials = []; // per-extruder: { type, density, name, vendor }
  const projFile = files.find(f => f.endsWith('project_settings.config'));
  if (projFile) {
    try {
      const projJson = JSON.parse(new TextDecoder().decode(unzipped[projFile]));
      // Bambu uses filament_colour (array of hex strings like "#FF0000FF")
      const rawColors = projJson.filament_colour || projJson.filament_color || [];
      filamentColors = (Array.isArray(rawColors) ? rawColors : [rawColors]).map(c => {
        if (typeof c === 'string') return c.replace(/^"(.*)"$/, '$1').trim();
        return null;
      });
      // Extract filament material data
      const fTypes = projJson.filament_type || [];
      const fDensity = projJson.filament_density || [];
      const fSettings = projJson.filament_settings_id || [];
      const fVendor = projJson.filament_vendor || [];
      const slotCount = Math.max(filamentColors.length, fTypes.length);
      for (let i = 0; i < slotCount; i++) {
        filamentMaterials.push({
          type: fTypes[i] || 'PLA',
          density: parseFloat(fDensity[i]) || 1.24,
          name: fSettings[i] || '',
          vendor: fVendor[i] || ''
        });
      }
      console.log('[3MF] Filament colors:', filamentColors);
      console.log('[3MF] Filament materials:', filamentMaterials);
      if (filamentMaterials.length > 0) group.userData.filamentMaterials = filamentMaterials;
    } catch (e) { console.warn('[3MF] Failed to parse project_settings.config:', e.message); }
  }

  await progress('Reading model settings...', 30);
  // Step B: Extract object → extruder mapping AND part names from model_settings.config
  const objectExtruderMap = new Map(); // objectId → extruder number (1-based)
  const objectNameMap = new Map(); // objectId → name string
  const partNameMap = new Map(); // partId → name string (for sub-parts)
  const objectPlateMap = new Map(); // objectId → platerId (from <plate><model_instance>)
  const plateNameMap = new Map(); // platerId → plater_name string
  const modelSettingsFile = files.find(f => f.endsWith('model_settings.config'));
  if (modelSettingsFile) {
    try {
      const msXml = new TextDecoder().decode(unzipped[modelSettingsFile]);
      const msDoc = new DOMParser().parseFromString(msXml, 'application/xml');
      msDoc.querySelectorAll('object').forEach(obj => {
        const oid = obj.getAttribute('id');
        if (!oid) return;
        // Read object-level metadata
        let objName = '';
        obj.querySelectorAll(':scope > metadata').forEach(md => {
          if (md.getAttribute('key') === 'extruder') {
            objectExtruderMap.set(oid, parseInt(md.getAttribute('value') || '1'));
          }
          if (md.getAttribute('key') === 'name') {
            objName = md.getAttribute('value') || '';
            objectNameMap.set(oid, objName);
          }
        });
        // Read part-level metadata (sub-parts within an assembly)
        obj.querySelectorAll('part').forEach(part => {
          const pid = part.getAttribute('id');
          if (!pid) return;
          part.querySelectorAll('metadata').forEach(md => {
            if (md.getAttribute('key') === 'name') {
              partNameMap.set(pid, md.getAttribute('value') || '');
            }
          });
        });
      });
      // Step B2: Parse <plate> elements for object → plate assignment and plate names
      msDoc.querySelectorAll('plate').forEach(plate => {
        let platerId = 0, platerName = '';
        plate.querySelectorAll(':scope > metadata').forEach(md => {
          if (md.getAttribute('key') === 'plater_id') platerId = parseInt(md.getAttribute('value') || '0');
          if (md.getAttribute('key') === 'plater_name') platerName = md.getAttribute('value') || '';
        });
        if (platerName) plateNameMap.set(platerId, platerName);
        plate.querySelectorAll('model_instance').forEach(inst => {
          let objId = '';
          inst.querySelectorAll('metadata').forEach(md => {
            if (md.getAttribute('key') === 'object_id') objId = md.getAttribute('value') || '';
          });
          if (objId) objectPlateMap.set(objId, platerId);
        });
      });
      console.log('[3MF] Object names:', Object.fromEntries(objectNameMap));
      console.log('[3MF] Part names:', Object.fromEntries(partNameMap));
      console.log('[3MF] Plate assignments:', Object.fromEntries(objectPlateMap));
      console.log('[3MF] Plate names:', Object.fromEntries(plateNameMap));
    } catch (e) { console.warn('[3MF] Failed to parse model_settings.config:', e.message); }
  }

  await progress('Mapping colors...', 40);
  // Step C: Build objectId → color by combining extruder map + filament colors
  const objectColorMap = new Map();
  for (const [objId, extruder] of objectExtruderMap) {
    const colorIdx = extruder - 1; // extruder is 1-based
    if (colorIdx >= 0 && colorIdx < filamentColors.length && filamentColors[colorIdx]) {
      objectColorMap.set(objId, filamentColors[colorIdx]);
    }
  }
  console.log('[3MF] Object colors:', Object.fromEntries(objectColorMap));

  // Step D: Also check standard 3MF basematerials (fallback for non-Bambu files)
  const globalColorMap = new Map();
  for (const modelFile of modelFiles) {
    const xml = new TextDecoder().decode(unzipped[modelFile]);
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    doc.querySelectorAll('*').forEach(el => {
      if (el.localName === 'base' && el.getAttribute('displaycolor')) {
        const parent = el.parentElement;
        const parentId = parent?.getAttribute('id');
        const idx = Array.from(parent?.children || []).indexOf(el);
        if (parentId != null) globalColorMap.set(`${parentId}_${idx}`, el.getAttribute('displaycolor'));
      }
      if (el.localName === 'basematerials' || el.localName === 'colorgroup') {
        const gid = el.getAttribute('id');
        if (gid) {
          Array.from(el.children).forEach((child, ci) => {
            const dc = child.getAttribute('displaycolor') || child.getAttribute('color');
            if (dc) globalColorMap.set(`${gid}_${ci}`, dc);
          });
        }
      }
    });
  }

  // ── Cross-file resolution pipeline ──
  // Bambu splits geometry across files: main model has items/components with p:path
  // pointing to external .model files. We need to:
  //   1. Parse all external files to collect meshes by (filePath, objectId)
  //   2. Parse main model for items → components → resolve via p:path + objectid
  //   3. Apply extruder-based colors from objectColorMap

  await progress('Building mesh index...', 50);
  // Build mesh index: "filepath::objectId" → { vertices, triangles }
  const meshIndex = new Map(); // key: "normalizedPath::objId" → mesh data array
  const pNS = 'http://schemas.microsoft.com/3dmanufacturing/production/2015/06';

  for (const modelFile of modelFiles) {
    const xml = new TextDecoder().decode(unzipped[modelFile]);
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const normalizedPath = '/' + modelFile;

    doc.querySelectorAll('*').forEach(el => {
      if (el.localName !== 'mesh') return;
      const vertices = [], triangles = [];
      let meshColor = null;

      el.querySelectorAll('*').forEach(child => {
        if (child.localName === 'vertex') {
          vertices.push(parseFloat(child.getAttribute('x')||0), parseFloat(child.getAttribute('y')||0), parseFloat(child.getAttribute('z')||0));
        }
        if (child.localName === 'triangle') {
          triangles.push(parseInt(child.getAttribute('v1')||0), parseInt(child.getAttribute('v2')||0), parseInt(child.getAttribute('v3')||0));
          // Standard 3MF color from basematerials
          const pid = child.getAttribute('pid'), p1 = child.getAttribute('p1');
          if (pid && p1 && !meshColor) meshColor = globalColorMap.get(`${pid}_${p1}`);
        }
      });

      if (vertices.length > 0 && triangles.length > 0) {
        const objEl = el.closest('object') || el.parentElement;
        const objId = objEl?.getAttribute('id') || '0';
        // Check object-level basematerials color
        const objPid = objEl?.getAttribute('pid'), objPindex = objEl?.getAttribute('pindex');
        if (!meshColor && objPid && objPindex != null) meshColor = globalColorMap.get(`${objPid}_${objPindex}`);

        const key = `${normalizedPath}::${objId}`;
        if (!meshIndex.has(key)) meshIndex.set(key, []);
        meshIndex.get(key).push({ vertices, triangles, color: meshColor });
      }
    });
  }

  await progress('Resolving components...', 65);
  // Find main model file (the one with <build> items that have components with p:path)
  const mainModelFile = modelFiles.find(f => f.includes('3dmodel.model')) || modelFiles[0];
  const mainXml = new TextDecoder().decode(unzipped[mainModelFile]);
  const mainDoc = new DOMParser().parseFromString(mainXml, 'application/xml');

  // Parse components from main model (these reference external files via p:path)
  const assemblyMap = new Map(); // objectId → [{ objectid, path, transform }]
  mainDoc.querySelectorAll('*').forEach(el => {
    if (el.localName === 'component') {
      const parentObj = el.closest('object');
      const parentId = parentObj?.getAttribute('id') || '0';
      const compObjId = el.getAttribute('objectid');
      const pPath = el.getAttributeNS(pNS, 'path') || el.getAttribute('p:path') || '';
      const transform = parseTransformAttr(el.getAttribute('transform'));
      if (!assemblyMap.has(parentId)) assemblyMap.set(parentId, []);
      assemblyMap.get(parentId).push({ objectid: compObjId, path: pPath, transform });
    }
  });

  await progress('Building geometry...', 75);
  // Parse build items from main model
  mainDoc.querySelectorAll('*').forEach(el => {
    if (el.localName !== 'item') return;
    const objectid = el.getAttribute('objectid');
    const itemTransform = parseTransformAttr(el.getAttribute('transform'));
    // Use Bambu plate assignment from model_settings.config, fall back to partnumber
    const bambuPlate = objectPlateMap.get(objectid);
    let plateId;
    if (bambuPlate !== undefined) {
      plateId = bambuPlate;
    } else {
      const partnumber = el.getAttribute('partnumber') || '';
      const plateMatch = partnumber.match(/(\d+)/);
      plateId = plateMatch ? parseInt(plateMatch[1]) : 0;
    }

    // Get color and material from Bambu extruder mapping for this item's assembly object
    const extruderColor = objectColorMap.get(objectid) || null;
    const extruderNum = objectExtruderMap.get(objectid);
    const filament = extruderNum ? filamentMaterials[extruderNum - 1] || null : null;
    const assemblyName = objectNameMap.get(objectid) || '';

    // Resolve components
    const components = assemblyMap.get(objectid);
    if (components && components.length > 0) {
      for (const comp of components) {
        const combinedXform = multiplyTransforms(itemTransform, comp.transform);
        // Part name: try partNameMap (sub-part by comp objectid), then assemblyName
        const partName = partNameMap.get(comp.objectid) || assemblyName || '';
        // Look up meshes in the external file
        const lookupKey = `${comp.path}::${comp.objectid}`;
        const meshArr = meshIndex.get(lookupKey) || [];
        for (const m of meshArr) {
          const colorStr = m.color || extruderColor;
          addMeshToPlate(m, combinedXform, colorStr, plateId, partName, filament);
        }
      }
    } else {
      // Direct meshes on this object (no components)
      const partName = assemblyName;
      const lookupKey = `/${mainModelFile}::${objectid}`;
      const meshArr = meshIndex.get(lookupKey) || [];
      for (const m of meshArr) {
        const colorStr = m.color || extruderColor;
        addMeshToPlate(m, itemTransform, colorStr, plateId, partName, filament);
      }
    }
  });

  function addMeshToPlate(meshData, transform, colorStr, plateId, partName, filament) {
    const geometry = createGeometryFromMesh(meshData);
    if (transform) geometry.applyMatrix4(transform);
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const color = colorStr ? parseColor(colorStr) : new THREE.Color(0xf59e0b);
    const material = new THREE.MeshStandardMaterial({ color, metalness: 0.1, roughness: 0.5, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.originalColor = color.clone();
    if (partName) mesh.name = partName;
    if (filament) mesh.userData.filament = filament;
    if (!plateGroups.has(plateId)) plateGroups.set(plateId, new THREE.Group());
    plateGroups.get(plateId).add(mesh);
  }

  // Fallback: if main model resolution produced nothing, try each file's own build items
  if (plateGroups.size === 0) {
    for (const modelFile of modelFiles) {
      if (modelFile === mainModelFile) continue;
      const xml = new TextDecoder().decode(unzipped[modelFile]);
      const meshes = parseModelXML(xml, globalColorMap);
      for (const meshData of meshes) {
        const extruderColor = objectColorMap.get(meshData.parentObjId) || null;
        const colorStr = meshData.color || extruderColor;
        const fallbackName = objectNameMap.get(meshData.parentObjId) || '';
        addMeshToPlate(meshData, meshData.transform, colorStr, meshData.plateId || 0, fallbackName);
      }
    }
  }

  if (plateGroups.size === 0 && stlFiles.length > 0) {
    for (const stlFile of stlFiles) {
      const stlBuffer = unzipped[stlFile].buffer;
      const geometry = parseSTLBuffer(stlBuffer);
      if (geometry) {
        const material = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.1, roughness: 0.5, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true; mesh.receiveShadow = true;
        mesh.userData.originalColor = new THREE.Color(0xf59e0b);
        if (!plateGroups.has(0)) plateGroups.set(0, new THREE.Group());
        plateGroups.get(0).add(mesh);
      }
    }
  }

  if (plateGroups.size === 0) throw new Error('No geometry found in 3MF file');
  await progress('Assembling plates...', 90);
  const sortedPlates = [...plateGroups.entries()].sort((a, b) => a[0] - b[0]);
  for (const [id, pg] of sortedPlates) {
    // Set plate group name from Bambu plate name, fallback to "Plate N"
    pg.name = plateNameMap.get(id) || `Plate ${id}`;
    group.add(pg);
  }
  return group;
}

function parseModelXML(xml, externalColorMap) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'application/xml');

  // Start with external (global) color map if provided, then add any local ones
  const colorMap = new Map(externalColorMap || []);
  doc.querySelectorAll('*').forEach(el => {
    if (el.localName === 'base' && el.getAttribute('displaycolor')) {
      const parent = el.parentElement;
      const parentId = parent?.getAttribute('id');
      const idx = Array.from(parent?.children || []).indexOf(el);
      if (parentId !== undefined && parentId !== null) {
        colorMap.set(`${parentId}_${idx}`, el.getAttribute('displaycolor'));
      }
    }
  });

  // 2. Parse <object> elements → collect meshes keyed by object id
  const objectMeshes = new Map(); // objectId → [{ vertices, triangles, color }]
  doc.querySelectorAll('*').forEach(el => {
    if (el.localName !== 'mesh') return;
    const vertices = [], triangles = [];
    let meshColor = null;

    el.querySelectorAll('*').forEach(child => {
      if (child.localName === 'vertex') {
        vertices.push(parseFloat(child.getAttribute('x')||0), parseFloat(child.getAttribute('y')||0), parseFloat(child.getAttribute('z')||0));
      }
      if (child.localName === 'triangle') {
        triangles.push(parseInt(child.getAttribute('v1')||0), parseInt(child.getAttribute('v2')||0), parseInt(child.getAttribute('v3')||0));
        const pid = child.getAttribute('pid'), p1 = child.getAttribute('p1');
        if (pid && p1 && !meshColor) meshColor = colorMap.get(`${pid}_${p1}`);
      }
    });

    if (vertices.length > 0 && triangles.length > 0) {
      const objEl = el.closest('object') || el.parentElement;
      const objId = objEl?.getAttribute('id') || '0';
      const pid = objEl?.getAttribute('pid'), pindex = objEl?.getAttribute('pindex');
      if (!meshColor && pid && pindex !== null) meshColor = colorMap.get(`${pid}_${pindex}`);
      if (!objectMeshes.has(objId)) objectMeshes.set(objId, []);
      objectMeshes.get(objId).push({ vertices, triangles, color: meshColor || null });
    }
  });

  // 3. Parse <item> elements → get objectid, transform, partnumber (plate)
  //    Also handle <component> children inside objects for assemblies
  const componentMap = new Map(); // objectId → [{ objectid, transform }]
  doc.querySelectorAll('*').forEach(el => {
    if (el.localName === 'component') {
      const parentObj = el.closest('object');
      const parentId = parentObj?.getAttribute('id') || '0';
      if (!componentMap.has(parentId)) componentMap.set(parentId, []);
      componentMap.set(parentId, [...(componentMap.get(parentId) || []), {
        objectid: el.getAttribute('objectid'),
        transform: parseTransformAttr(el.getAttribute('transform'))
      }]);
    }
  });

  // Also build object-level color map (from pid/pindex on <object> elements)
  const objectColorMap = new Map();
  doc.querySelectorAll('*').forEach(el => {
    if (el.localName === 'object') {
      const oid = el.getAttribute('id');
      const pid = el.getAttribute('pid'), pindex = el.getAttribute('pindex');
      if (oid && pid && pindex != null) {
        const c = colorMap.get(`${pid}_${pindex}`);
        if (c) objectColorMap.set(oid, c);
      }
    }
  });

  const results = [];
  doc.querySelectorAll('*').forEach(el => {
    if (el.localName !== 'item') return;
    const objectid = el.getAttribute('objectid');
    const transform = parseTransformAttr(el.getAttribute('transform'));
    const partnumber = el.getAttribute('partnumber') || '';
    const plateMatch = partnumber.match(/(\d+)/);
    const plateId = plateMatch ? parseInt(plateMatch[1]) : 0;

    // Item-level color (pid/pindex on the <item> itself)
    const itemPid = el.getAttribute('pid'), itemPindex = el.getAttribute('pindex');
    const itemColor = (itemPid && itemPindex != null) ? colorMap.get(`${itemPid}_${itemPindex}`) : null;

    // Resolve: if the object has components, expand them; otherwise use its meshes directly
    const components = componentMap.get(objectid);
    if (components && components.length > 0) {
      for (const comp of components) {
        const meshes = objectMeshes.get(comp.objectid) || [];
        const combinedXform = multiplyTransforms(transform, comp.transform);
        const compObjColor = objectColorMap.get(comp.objectid);
        const parentObjColor = objectColorMap.get(objectid);
        for (const m of meshes) {
          const color = m.color || compObjColor || parentObjColor || itemColor || null;
          results.push({ ...m, color, plateId, transform: combinedXform });
        }
      }
    } else {
      const meshes = objectMeshes.get(objectid) || [];
      const objColor = objectColorMap.get(objectid);
      for (const m of meshes) {
        const color = m.color || objColor || itemColor || null;
        results.push({ ...m, color, plateId, transform });
      }
    }
  });

  // If no <item> elements found, fall back to raw meshes without transforms
  if (results.length === 0) {
    for (const [, meshArr] of objectMeshes) {
      for (const m of meshArr) results.push({ ...m, plateId: 0, transform: null });
    }
  }

  return results;
}

// Parse 3MF transform attribute "m00 m01 m02 m10 m11 m12 m20 m21 m22 m30 m31 m32" → THREE.Matrix4
function parseTransformAttr(attr) {
  if (!attr) return null;
  const v = attr.trim().split(/\s+/).map(Number);
  if (v.length < 12) return null;
  // 3MF stores a 4x3 matrix (row-major: 3 rotation rows + 1 translation row)
  // Three.js Matrix4 is column-major
  const m = new THREE.Matrix4();
  m.set(
    v[0], v[3], v[6], v[9],
    v[1], v[4], v[7], v[10],
    v[2], v[5], v[8], v[11],
    0,    0,    0,    1
  );
  return m;
}

function multiplyTransforms(a, b) {
  if (!a && !b) return null;
  if (!a) return b;
  if (!b) return a;
  return new THREE.Matrix4().multiplyMatrices(a, b);
}

function createGeometryFromMesh(meshData) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(meshData.vertices), 3));
  geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(meshData.triangles), 1));
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  return geometry;
}

function parseSTLBuffer(buffer) {
  const view = new DataView(buffer.slice ? buffer : buffer.buffer || buffer);
  if (buffer.byteLength < 84) return null;
  const triCount = view.getUint32(80, true);
  if (80 + 4 + triCount * 50 !== buffer.byteLength) return parseASCIISTL(new TextDecoder().decode(new Uint8Array(buffer)));

  const positions = new Float32Array(triCount * 9);
  const normals = new Float32Array(triCount * 9);
  let offset = 84;
  for (let i = 0; i < triCount; i++) {
    const nx = view.getFloat32(offset, true); offset += 4;
    const ny = view.getFloat32(offset, true); offset += 4;
    const nz = view.getFloat32(offset, true); offset += 4;
    for (let j = 0; j < 3; j++) {
      const idx = i * 9 + j * 3;
      positions[idx] = view.getFloat32(offset, true); offset += 4;
      positions[idx+1] = view.getFloat32(offset, true); offset += 4;
      positions[idx+2] = view.getFloat32(offset, true); offset += 4;
      normals[idx] = nx; normals[idx+1] = ny; normals[idx+2] = nz;
    }
    offset += 2;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  return geometry;
}

function parseASCIISTL(text) {
  const positions = [];
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (t.startsWith('vertex')) { const p = t.split(/\s+/); positions.push(parseFloat(p[1]), parseFloat(p[2]), parseFloat(p[3])); }
  }
  if (!positions.length) return null;
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geometry.computeVertexNormals();
  return geometry;
}

// ─── Model Processing ───
function processModel(object, fileName) {
  if (modelGroup) {
    scene.remove(modelGroup);
    modelGroup.traverse(c => { c.geometry?.dispose(); if(c.material) (Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose()); });
  }

  modelGroup = new THREE.Group();
  plates = [];

  // Detect filament data from 3MF and update UI accordingly
  hasFilamentData = !!(object.userData?.filamentMaterials?.length);
  const materialRow = materialSelect.closest('.flex.items-center');
  if (materialRow) materialRow.style.display = hasFilamentData ? 'none' : '';

  const hasSubGroups = object.children.some(c => c.isGroup && c.children.length > 0);

  if (hasSubGroups) {
    object.children.forEach((child, i) => {
      if (child.isGroup && child.children.length > 0) {
        const pg = new THREE.Group();
        child.traverse(m => { if (m.isMesh) { ensureMaterial(m); pg.add(m.clone()); } });
        pg.visible = false;
        plates.push({ group: pg, name: child.name || 'Plate ' + (i + 1), colors: getColors(pg) });
        modelGroup.add(pg);
      } else if (child.isMesh) {
        if (!plates.length) { const pg = new THREE.Group(); pg.visible = false; plates.push({ group: pg, name: 'Plate 1', colors: [] }); modelGroup.add(pg); }
        ensureMaterial(child); plates[0].group.add(child.clone());
      }
    });
  }

  if (!plates.length) {
    const pg = new THREE.Group();
    object.traverse(m => { if (m.isMesh) { ensureMaterial(m); pg.add(m.clone()); } });
    pg.visible = false;
    plates.push({ group: pg, name: 'All Objects', colors: getColors(pg) });
    modelGroup.add(pg);
  }

  // Auto-layout all parts onto beds
  autoLayoutPlates();
  plates.forEach(p => { p.colors = getColors(p.group); });
  scene.add(modelGroup);
  activePlateIndex = 0;
  showPlate(0);
  updateUI(fileName);
  hideLoading();
}

// ─── Lay Flat: rotate mesh so it sits stably on the bed with no floating geometry ───

function layFlatMesh(mesh) {
  const geo = mesh.geometry;
  if (!geo || !geo.attributes.position) return;

  const pos = geo.attributes.position;
  const idx = geo.index;
  const triCount = idx ? idx.count / 3 : pos.count / 3;
  if (triCount < 1) return;

  // 1. Collect all world-space vertices and face data
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const edge1 = new THREE.Vector3(), edge2 = new THREE.Vector3(), normal = new THREE.Vector3();
  const worldVerts = []; // all world-space vertices (flat: x,y,z,x,y,z,...)
  const faces = [];      // { nx, ny, nz, area }

  for (let i = 0; i < triCount; i++) {
    let ia, ib, ic;
    if (idx) { ia = idx.getX(i * 3); ib = idx.getX(i * 3 + 1); ic = idx.getX(i * 3 + 2); }
    else { ia = i * 3; ib = i * 3 + 1; ic = i * 3 + 2; }
    vA.fromBufferAttribute(pos, ia); vA.applyMatrix4(mesh.matrixWorld);
    vB.fromBufferAttribute(pos, ib); vB.applyMatrix4(mesh.matrixWorld);
    vC.fromBufferAttribute(pos, ic); vC.applyMatrix4(mesh.matrixWorld);
    worldVerts.push(vA.x, vA.y, vA.z, vB.x, vB.y, vB.z, vC.x, vC.y, vC.z);
    edge1.subVectors(vB, vA); edge2.subVectors(vC, vA);
    normal.crossVectors(edge1, edge2);
    const area = normal.length() * 0.5;
    if (area < 0.001) continue;
    normal.normalize();
    faces.push({ nx: normal.x, ny: normal.y, nz: normal.z, area });
  }
  if (faces.length === 0) return;

  // 2. Cluster normals (within ~10°)
  const clusters = [];
  const threshold = Math.cos(10 * Math.PI / 180);
  for (const f of faces) {
    let matched = false;
    for (const cl of clusters) {
      const dot = cl.nx * f.nx + cl.ny * f.ny + cl.nz * f.nz;
      if (dot > threshold) {
        const w = cl.totalArea;
        cl.nx = (cl.nx * w + f.nx * f.area) / (w + f.area);
        cl.ny = (cl.ny * w + f.ny * f.area) / (w + f.area);
        cl.nz = (cl.nz * w + f.nz * f.area) / (w + f.area);
        const len = Math.sqrt(cl.nx ** 2 + cl.ny ** 2 + cl.nz ** 2);
        cl.nx /= len; cl.ny /= len; cl.nz /= len;
        cl.totalArea += f.area;
        matched = true;
        break;
      }
    }
    if (!matched) clusters.push({ nx: f.nx, ny: f.ny, nz: f.nz, totalArea: f.area });
  }
  if (clusters.length === 0) return;

  // 3. Evaluate ALL face clusters × 2 orientations + 6 principal axes
  clusters.sort((a, b) => b.totalArea - a.totalArea);
  const down = new THREE.Vector3(0, -1, 0);
  const up = new THREE.Vector3(0, 1, 0);

  geo.computeBoundingBox();
  const objCenter = new THREE.Vector3();
  geo.boundingBox.getCenter(objCenter);
  objCenter.applyMatrix4(mesh.matrixWorld);

  const evalCandidates = []; // { q: Quaternion }

  function makeQuat(fromVec, toVec) {
    const q = new THREE.Quaternion();
    const d = fromVec.dot(toVec);
    if (d < -0.9999) { q.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI); }
    else if (d > 0.9999) { q.identity(); }
    else { q.setFromUnitVectors(fromVec, toVec); }
    return q;
  }

  // Every cluster, both orientations (no artificial penalty)
  for (const cl of clusters) {
    const faceN = new THREE.Vector3(cl.nx, cl.ny, cl.nz);
    evalCandidates.push({ q: makeQuat(faceN, down) }); // this face on bed
    evalCandidates.push({ q: makeQuat(faceN, up) });   // opposite face on bed
  }

  // 6 principal axes
  for (const ax of [
    new THREE.Vector3(1,0,0), new THREE.Vector3(-1,0,0),
    new THREE.Vector3(0,1,0), new THREE.Vector3(0,-1,0),
    new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,-1),
  ]) {
    evalCandidates.push({ q: makeQuat(ax, down) });
  }

  // Deduplicate near-identical quaternions
  const uniqueCandidates = [];
  for (const c of evalCandidates) {
    if (!uniqueCandidates.some(u => u.q.angleTo(c.q) < 0.05)) {
      uniqueCandidates.push(c);
    }
  }

  let bestScore = -Infinity;
  let bestQuat = null;

  for (const { q } of uniqueCandidates) {
    const score = evaluateOrientation(worldVerts, faces, objCenter, q);
    if (score > bestScore) {
      bestScore = score;
      bestQuat = q;
    }
  }

  if (!bestQuat) return;

  const identityTest = new THREE.Quaternion();
  if (bestQuat.angleTo(identityTest) < 0.02) return;

  // 4. Apply winning rotation
  const toOrigin = new THREE.Matrix4().makeTranslation(-objCenter.x, -objCenter.y, -objCenter.z);
  const rotate = new THREE.Matrix4().makeRotationFromQuaternion(bestQuat);
  const fromOrigin = new THREE.Matrix4().makeTranslation(objCenter.x, objCenter.y, objCenter.z);
  const m4 = new THREE.Matrix4().multiplyMatrices(fromOrigin, rotate).multiply(toOrigin);

  geo.applyMatrix4(m4);
  geo.computeVertexNormals();
  geo.computeBoundingBox();

  mesh.position.set(0, 0, 0);
  mesh.rotation.set(0, 0, 0);
  mesh.scale.set(1, 1, 1);
  mesh.updateMatrixWorld(true);
}

// Score a candidate orientation by computing ACTUAL bed contact area, height, and support
function evaluateOrientation(worldVerts, faces, pivot, quat) {
  const nVerts = worldVerts.length / 3;
  const totalTris = nVerts / 3;
  const v = new THREE.Vector3();

  // Rotate all vertices
  const ry = new Float32Array(nVerts); // rotated Y values
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < nVerts; i++) {
    v.set(worldVerts[i * 3], worldVerts[i * 3 + 1], worldVerts[i * 3 + 2]);
    v.sub(pivot); v.applyQuaternion(quat); v.add(pivot);
    ry[i] = v.y;
    if (v.y < minY) minY = v.y;
    if (v.y > maxY) maxY = v.y;
  }

  const totalH = maxY - minY;
  if (totalH < 0.01) return 1000; // flat object, fine

  const bedTol = Math.min(totalH * 0.03, 2.0) + 0.3; // adaptive tolerance

  // Compute ACTUAL bed contact area: sum area of triangles whose all 3 verts are near bed
  let bedContactArea = 0;
  let nearBedArea = 0; // at least 1 vert near bed
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();

  for (let t = 0; t < totalTris; t++) {
    const y0 = ry[t * 3] - minY;
    const y1 = ry[t * 3 + 1] - minY;
    const y2 = ry[t * 3 + 2] - minY;

    // Compute triangle area
    const i0 = t * 3, i1 = t * 3 + 1, i2 = t * 3 + 2;
    vA.set(worldVerts[i0*3], worldVerts[i0*3+1], worldVerts[i0*3+2]);
    vB.set(worldVerts[i1*3], worldVerts[i1*3+1], worldVerts[i1*3+2]);
    vC.set(worldVerts[i2*3], worldVerts[i2*3+1], worldVerts[i2*3+2]);
    e1.subVectors(vB, vA); e2.subVectors(vC, vA);
    const triArea = n.crossVectors(e1, e2).length() * 0.5;

    if (y0 <= bedTol && y1 <= bedTol && y2 <= bedTol) {
      bedContactArea += triArea;  // fully on bed
    }
    if (Math.min(y0, y1, y2) <= bedTol) {
      nearBedArea += triArea;
    }
  }

  // Column support analysis (16×16 for better resolution)
  const gridRes = 16;
  const rx = new Float32Array(nVerts);
  const rz = new Float32Array(nVerts);
  let xMin = Infinity, xMax = -Infinity, zMin = Infinity, zMax = -Infinity;

  for (let i = 0; i < nVerts; i++) {
    v.set(worldVerts[i*3], worldVerts[i*3+1], worldVerts[i*3+2]);
    v.sub(pivot); v.applyQuaternion(quat); v.add(pivot);
    rx[i] = v.x; rz[i] = v.z;
    if (v.x < xMin) xMin = v.x; if (v.x > xMax) xMax = v.x;
    if (v.z < zMin) zMin = v.z; if (v.z > zMax) zMax = v.z;
  }
  const xSpan = xMax - xMin || 1, zSpan = zMax - zMin || 1;

  const cellHasGeo = new Uint8Array(gridRes * gridRes);
  const cellMinY = new Float32Array(gridRes * gridRes).fill(Infinity);

  for (let i = 0; i < nVerts; i++) {
    const gx = Math.min(gridRes-1, Math.floor((rx[i]-xMin)/xSpan*gridRes));
    const gz = Math.min(gridRes-1, Math.floor((rz[i]-zMin)/zSpan*gridRes));
    const ci = gz * gridRes + gx;
    cellHasGeo[ci] = 1;
    const yg = ry[i] - minY;
    if (yg < cellMinY[ci]) cellMinY[ci] = yg;
  }

  let occupied = 0, supported = 0;
  for (let i = 0; i < gridRes * gridRes; i++) {
    if (cellHasGeo[i]) {
      occupied++;
      if (cellMinY[i] <= bedTol) supported++;
    }
  }

  const supportRatio = occupied > 0 ? supported / occupied : 0;
  const floatingRatio = 1 - supportRatio;

  // Center of gravity analysis: compute CoG height and lateral offset
  let cogX = 0, cogY = 0, cogZ = 0;
  for (let i = 0; i < nVerts; i++) {
    cogX += rx[i]; cogY += (ry[i] - minY); cogZ += rz[i];
  }
  cogX /= nVerts; cogY /= nVerts; cogZ /= nVerts;

  // CoG height ratio: 0 = on bed, 1 = at top; lower is more stable
  const cogHeightRatio = totalH > 0.01 ? cogY / totalH : 0;

  // CoG lateral offset: how far CoG XZ is from supported footprint center
  let supCX = 0, supCZ = 0, supCount = 0;
  for (let i = 0; i < gridRes * gridRes; i++) {
    if (cellHasGeo[i] && cellMinY[i] <= bedTol) {
      const gx = i % gridRes, gz = Math.floor(i / gridRes);
      supCX += xMin + (gx + 0.5) / gridRes * xSpan;
      supCZ += zMin + (gz + 0.5) / gridRes * zSpan;
      supCount++;
    }
  }
  let cogLateralPenalty = 0;
  if (supCount > 0) {
    supCX /= supCount; supCZ /= supCount;
    const dx = cogX - supCX, dz = cogZ - supCZ;
    const lateralDist = Math.sqrt(dx * dx + dz * dz);
    const footprintSpan = Math.max(xSpan, zSpan);
    cogLateralPenalty = footprintSpan > 0.01 ? (lateralDist / footprintSpan) : 0;
  }

  // Aspect ratio: how "tippy" this orientation is (tall+narrow = bad)
  const footprintArea = xSpan * zSpan;
  const aspectPenalty = footprintArea > 0.01 ? (totalH * totalH) / footprintArea : 0;

  // Combined CoG penalty scales with object dimensions so it competes with bedContactArea
  // cogY is absolute mm above bed; cogHeightRatio × totalH recovers that
  // Multiply ratio by totalH so a tall-standing thin object gets hammered
  const cogPenalty =
    cogHeightRatio * totalH * 3.0 +     // absolute CoG height in mm, weighted
    cogLateralPenalty * totalH * 2.0 +   // lateral offset scaled by height
    aspectPenalty * 5.0;                 // tall-and-narrow instability

  // SCORING: all factors are independent, no contactArea multiplier bias
  const score =
    bedContactArea * 10.0 +           // THE key metric: actual flat area on bed
    nearBedArea * 2.0 +               // partial contact also helps
    supportRatio * 500 -              // reward columns reaching the bed
    floatingRatio * 800 -             // penalize floating columns
    totalH * 5.0 -                    // prefer shorter height
    cogPenalty;                        // penalize high, off-center, or tippy CoG

  return score;
}

// Apply lay-flat to all meshes in a group
function layFlatGroup(group) {
  group.children.forEach(c => { if (c.isMesh) layFlatMesh(c); });
}

// ─── Auto Layout: 2D bin-pack all meshes across plates to fit on bed ───

// Collect every mesh across all current plates into a flat list with its XZ footprint
function gatherMeshItems() {
  const items = [];
  for (const plate of plates) {
    const toRemove = [];
    plate.group.children.forEach(c => {
      if (!c.isMesh || !c.geometry) return;
      c.updateMatrixWorld(true);
      if (!c.geometry.boundingBox) c.geometry.computeBoundingBox();
      const box = c.geometry.boundingBox.clone().applyMatrix4(c.matrixWorld);
      const sz = new THREE.Vector3(); box.getSize(sz);
      const ctr = new THREE.Vector3(); box.getCenter(ctr);
      items.push({ mesh: c, w: sz.x, d: sz.z, h: sz.y, cx: ctr.x, cz: ctr.z, cy: ctr.y, box });
      toRemove.push(c);
    });
    toRemove.forEach(m => plate.group.remove(m));
  }
  // Sort largest-footprint-first for better packing
  items.sort((a, b) => (b.w * b.d) - (a.w * a.d));
  return items;
}

// Shelf-based 2D bin-packing onto a bedW × bedD area
// Returns { placed: [{item, x, z}], overflow: [item] }
function shelfPack(items, bedW, bedD, gap) {
  const usable_w = bedW - 2 * BED_PAD;
  const usable_d = bedD - 2 * BED_PAD;
  const placed = [];
  const overflow = [];

  // Shelves: each shelf has a y-cursor (along Z axis on bed), height = tallest item in shelf
  let shelfZ = 0;      // current shelf start Z
  let shelfH = 0;      // current shelf depth (tallest item Z-size)
  let cursorX = 0;     // X cursor within current shelf

  for (const item of items) {
    const iw = item.w + gap;
    const id = item.d + gap;

    // Item too big for the bed entirely? still place it, it'll just stick out
    if (item.w > usable_w && item.d > usable_d) {
      // Try rotating
    }

    // Try fitting in current shelf
    if (cursorX + item.w <= usable_w && shelfZ + Math.max(shelfH, id) <= usable_d) {
      // If this item is deeper than the shelf, check if it still fits
      if (shelfZ + id <= usable_d) {
        placed.push({ item, x: cursorX, z: shelfZ });
        cursorX += iw;
        shelfH = Math.max(shelfH, id);
        continue;
      }
    }

    // Start new shelf
    if (cursorX > 0) {
      shelfZ += shelfH;
      cursorX = 0;
      shelfH = 0;
    }

    // Fits on new shelf?
    if (shelfZ + id <= usable_d && item.w <= usable_w) {
      placed.push({ item, x: cursorX, z: shelfZ });
      cursorX += iw;
      shelfH = Math.max(shelfH, id);
    } else {
      overflow.push(item);
    }
  }

  return { placed, overflow };
}

// Run auto-layout: lay flat + pack meshes onto bed
// If plates already have Bambu names (from model_settings.config), layout within each plate.
// Otherwise, pool all meshes and re-bin across new plates.
function autoLayoutPlates() {
  // Lay flat all meshes before computing footprints
  plates.forEach(p => layFlatGroup(p.group));

  // Check if we have named plates from Bambu (not generic "Plate N")
  const hasBambuPlates = plates.length > 1 || (plates.length === 1 && plates[0].name && !plates[0].name.match(/^Plate \d+$/));

  if (hasBambuPlates && plates.length > 0) {
    // Layout within each existing plate separately
    const gap = 8;
    for (const plate of plates) {
      const items = [];
      const toRemove = [];
      plate.group.children.forEach(c => {
        if (!c.isMesh || !c.geometry) return;
        c.updateMatrixWorld(true);
        if (!c.geometry.boundingBox) c.geometry.computeBoundingBox();
        const box = c.geometry.boundingBox.clone().applyMatrix4(c.matrixWorld);
        const sz = new THREE.Vector3(); box.getSize(sz);
        const ctr = new THREE.Vector3(); box.getCenter(ctr);
        items.push({ mesh: c, w: sz.x, d: sz.z, h: sz.y, cx: ctr.x, cz: ctr.z, cy: ctr.y, box });
        toRemove.push(c);
      });
      toRemove.forEach(m => plate.group.remove(m));
      items.sort((a, b) => (b.w * b.d) - (a.w * a.d));

      const { placed, overflow } = shelfPack(items, BED_W, BED_D, gap);
      for (const { item, x, z } of placed) {
        const targetX = -BED_W / 2 + BED_PAD + x + item.w / 2;
        const targetZ = -BED_D / 2 + BED_PAD + z + item.d / 2;
        item.mesh.position.x += targetX - item.cx;
        item.mesh.position.z += targetZ - item.cz;
        item.mesh.position.y += -(item.cy - item.h / 2);
        plate.group.add(item.mesh);
      }
      // Overflow items still go on same plate (just won't fit neatly)
      for (const item of overflow) {
        item.mesh.position.x += -item.cx;
        item.mesh.position.z += -item.cz;
        item.mesh.position.y += -(item.cy - item.h / 2);
        plate.group.add(item.mesh);
      }
    }
    console.log(`Auto-layout: ${plates.length} Bambu plate(s) laid out individually`);
    return;
  }

  // Fallback: pool all meshes and re-bin across new plates
  const allItems = gatherMeshItems();
  if (allItems.length === 0) return;

  plates.forEach(p => modelGroup.remove(p.group));
  plates = [];

  const gap = 8;
  let remaining = allItems;
  let plateNum = 1;

  while (remaining.length > 0) {
    const { placed, overflow } = shelfPack(remaining, BED_W, BED_D, gap);

    if (placed.length === 0 && overflow.length > 0) {
      const big = overflow.shift();
      const pg = new THREE.Group();
      pg.visible = false;
      big.mesh.position.x += -big.cx;
      big.mesh.position.z += -big.cz;
      big.mesh.position.y += -(big.cy - big.h / 2);
      pg.add(big.mesh);
      plates.push({ group: pg, name: 'Plate ' + plateNum, colors: [] });
      modelGroup.add(pg);
      plateNum++;
      remaining = overflow;
      continue;
    }

    const pg = new THREE.Group();
    pg.visible = false;

    for (const { item, x, z } of placed) {
      const targetX = -BED_W / 2 + BED_PAD + x + item.w / 2;
      const targetZ = -BED_D / 2 + BED_PAD + z + item.d / 2;
      item.mesh.position.x += targetX - item.cx;
      item.mesh.position.z += targetZ - item.cz;
      item.mesh.position.y += -(item.cy - item.h / 2);
      pg.add(item.mesh);
    }

    plates.push({ group: pg, name: 'Plate ' + plateNum, colors: [] });
    modelGroup.add(pg);
    plateNum++;
    remaining = overflow;
  }

  if (plates.length === 1) plates[0].name = 'All Objects';
  console.log(`Auto-layout: ${allItems.length} objects across ${plates.length} plate(s)`);
}

function ensureMaterial(mesh) {
  if (!mesh.isMesh) return;
  mesh.castShadow = true; mesh.receiveShadow = true;
  const col = mesh.material?.color?.clone() || new THREE.Color(0xf59e0b);
  mesh.material = new THREE.MeshStandardMaterial({ color: col, metalness: 0.1, roughness: 0.5, side: THREE.DoubleSide });
  mesh.userData.originalColor = col;
  if (mesh.geometry) { mesh.geometry.computeVertexNormals(); mesh.geometry.computeBoundingBox(); }
}

function getColors(group) {
  const map = new Map();
  group.traverse(c => { if (c.isMesh && c.material?.color) { const h = c.material.color.getHexString(); if(!map.has(h)) map.set(h, c.material.color.clone()); }});
  return [...map.values()];
}

// ─── Mesh volume (signed tetrahedron method, result in mm³) ───
function computeMeshVolume(mesh) {
  const geo = mesh.geometry;
  if (!geo || !geo.attributes.position) return 0;
  const pos = geo.attributes.position;
  const idx = geo.index;
  const triCount = idx ? idx.count / 3 : pos.count / 3;
  let vol = 0;
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  mesh.updateMatrixWorld(true);
  for (let i = 0; i < triCount; i++) {
    let ia, ib, ic;
    if (idx) { ia = idx.getX(i*3); ib = idx.getX(i*3+1); ic = idx.getX(i*3+2); }
    else { ia = i*3; ib = i*3+1; ic = i*3+2; }
    vA.fromBufferAttribute(pos, ia).applyMatrix4(mesh.matrixWorld);
    vB.fromBufferAttribute(pos, ib).applyMatrix4(mesh.matrixWorld);
    vC.fromBufferAttribute(pos, ic).applyMatrix4(mesh.matrixWorld);
    // Signed volume of tetrahedron formed with origin
    vol += vA.dot(vB.clone().cross(vC)) / 6.0;
  }
  return Math.abs(vol);
}

// Estimate weight using wall thickness, infill %, and material density
// Uses a simplified shell model: walls + top/bottom solid layers are 100% fill,
// interior gets the chosen infill percentage
function estimateWeight(volumeMm3, overrideDensity) {
  const volCm3 = volumeMm3 / 1000; // mm³ → cm³
  // Wall shell thickness
  const wallThickness = wallCount * nozzleDia; // mm
  const topBottomThickness = topBottomLayers * layerHeight; // mm
  // For a "typical" part, approximate surface-to-volume ratio
  // We use a cube-equivalent model: side = cbrt(volumeMm3)
  const side = Math.cbrt(volumeMm3);
  if (side < 0.01) return 0;
  // Shell volume as fraction of total (simplified box model)
  // Total vol = side³; interior vol = (side - 2*wall)² * (side - 2*tb)
  const innerW = Math.max(0, side - 2 * wallThickness);
  const innerH = Math.max(0, side - 2 * topBottomThickness);
  const innerVol = innerW * innerW * innerH;
  const shellVol = side * side * side - innerVol;
  const shellFraction = shellVol / (side * side * side);
  const infillFraction = (1 - shellFraction) * (infillPercent / 100);
  const effectiveFill = shellFraction + infillFraction;
  const density = overrideDensity || MATERIALS[selectedMaterialIdx].density;
  return volCm3 * effectiveFill * density;
}

// ─── Object selection ───
function selectMesh(mesh) {
  // Deselect previous
  if (selectedMesh && selectedMesh.material) {
    selectedMesh.material.emissive?.setHex(0x000000);
  }
  selectedMesh = mesh;
  if (mesh && mesh.material) {
    mesh.material.emissive?.setHex(0x1a1a1a);
  }
  // Highlight in object list
  document.querySelectorAll('.obj-item').forEach(el => {
    el.classList.toggle('ring-1', false);
    el.classList.toggle('ring-amber-500/50', false);
    el.classList.toggle('bg-amber-500/5', false);
  });
  if (mesh) {
    const idx = mesh.userData.objIndex;
    const el = document.querySelector(`.obj-item[data-idx="${idx}"]`);
    if (el) {
      el.classList.add('ring-1', 'ring-amber-500/50', 'bg-amber-500/5');
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

// ─── Plate / Camera ───
function showPlate(index) {
  plates.forEach((p, i) => { p.group.visible = (i === index); });
  activePlateIndex = index;
  document.querySelectorAll('.plate-item').forEach((el, i) => el.classList.toggle('active', i === index));
  selectMesh(null);
  updateObjectsPanel(plates[index]);
  fitCameraToGroup(plates[index].group);
  updateModelInfo(plates[index]);
}

function fitCameraToGroup(group) {
  const box = new THREE.Box3().setFromObject(group);
  if (box.isEmpty()) return;
  box.getCenter(modelCenter);
  box.getSize(modelSize);
  cameraDistance = Math.max(modelSize.x, modelSize.y, modelSize.z) * 1.8;
  cameraDistance = Math.max(cameraDistance, 50);
  controls.target.copy(modelCenter);
  camera.position.set(modelCenter.x + cameraDistance * 0.6, modelCenter.y + cameraDistance * 0.5, modelCenter.z + cameraDistance * 0.6);
  camera.lookAt(modelCenter);
  controls.update();

  scene.traverse(c => {
    if (c.isDirectionalLight && c.castShadow) {
      const e = cameraDistance * 1.5;
      Object.assign(c.shadow.camera, { left: -e, right: e, top: e, bottom: -e, far: e * 4 });
      c.position.set(modelCenter.x + e, modelCenter.y + e * 1.5, modelCenter.z + e);
      c.target.position.copy(modelCenter);
      c.shadow.camera.updateProjectionMatrix();
    }
  });
}

function setCameraView(view) {
  const d = cameraDistance, c = modelCenter;
  const pos = {
    front: [c.x, c.y, c.z+d], back: [c.x, c.y, c.z-d],
    left: [c.x-d, c.y, c.z], right: [c.x+d, c.y, c.z],
    top: [c.x, c.y+d, c.z+0.01], bottom: [c.x, c.y-d, c.z+0.01],
  }[view];
  if (!pos) return;
  const start = camera.position.clone(), end = new THREE.Vector3(...pos), t0 = performance.now();
  (function anim(now) {
    const t = Math.min((now - t0) / 400, 1);
    camera.position.lerpVectors(start, end, 1 - Math.pow(1 - t, 3));
    camera.lookAt(modelCenter); controls.update();
    if (t < 1) requestAnimationFrame(anim);
  })(t0);
}

// ─── UI ───
function updateUI(fileName) {
  modelNameText.textContent = fileName.replace('.3mf', '');
  modelNameEl.classList.remove('model-name-hidden');
  openBtn.classList.remove('model-name-hidden');
  const bambuBtn = document.getElementById('bambu-btn');
  if (hasFilamentData) bambuBtn.classList.remove('model-name-hidden');
  else bambuBtn.classList.add('model-name-hidden');

  plateList.innerHTML = '';
  if (plates.length > 1) {
    plates.forEach((plate, i) => {
      const item = document.createElement('div');
      item.className = 'plate-item px-3 py-2.5 cursor-pointer flex items-center gap-2 text-sm font-mono text-zinc-300' + (i === 0 ? ' active' : '');
      const dots = plate.colors.slice(0, 5).map(c =>
        `<div class="w-2.5 h-2.5 rounded-full border border-white/10" style="background:#${c.getHexString()}"></div>`
      ).join('');
      item.innerHTML = `<div class="flex-1 min-w-0"><div class="truncate">${plate.name}</div><div class="flex gap-1 mt-1">${dots}</div></div>`;
      item.onclick = () => showPlate(i);
      plateList.appendChild(item);
    });
    plateSidebar.classList.remove('hidden');
  } else {
    plateSidebar.classList.add('hidden');
  }
  objectsPanel.classList.remove('hidden');
  modelInfo.classList.remove('hidden');
  bottomBar.style.display = 'flex';
}

function updateObjectsPanel(plate) {
  objectList.innerHTML = '';
  const meshes = [];
  plate.group.children.forEach((c, i) => { if (c.isMesh) { c.userData.objIndex = i; meshes.push(c); } });

  if (meshes.length === 0) {
    objectList.innerHTML = '<div class="text-xs text-zinc-500 font-mono px-3 py-2">No objects</div>';
    updateWeightInfo([]);
    return;
  }

  meshes.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'obj-item flex items-center gap-2 px-2 py-1.5 mx-1 rounded cursor-pointer hover:bg-zinc-800/50 transition-colors';
    row.dataset.idx = m.userData.objIndex;
    const hex = m.material?.color ? '#' + m.material.color.getHexString() : '#f59e0b';
    const name = m.name || `Object ${i + 1}`;
    const fil = m.userData.filament;
    const matLabel = fil ? `<span class="text-[10px] font-mono text-zinc-500 shrink-0" title="${fil.name || ''}">${fil.type}</span>` : '';
    row.innerHTML = `
      <input type="color" value="${hex}" class="obj-color w-5 h-5 rounded border border-zinc-600 cursor-pointer bg-transparent p-0 shrink-0" title="Change color" style="appearance:none;-webkit-appearance:none;">
      <span class="text-xs font-mono text-zinc-300 truncate flex-1" title="${name}">${name}</span>
      ${matLabel}
      <span class="text-[10px] font-mono text-zinc-600 shrink-0 obj-weight"></span>
    `;
    // Color picker
    row.querySelector('.obj-color').addEventListener('input', (e) => {
      const col = new THREE.Color(e.target.value);
      m.material.color.copy(col);
      m.userData.originalColor = col.clone();
      plate.colors = getColors(plate.group);
    });
    // Click to select
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('obj-color')) return;
      selectMesh(m);
    });
    objectList.appendChild(row);
  });

  updateWeightInfo(meshes);
}

function updateWeightInfo(meshes) {
  if (meshes.length === 0) {
    weightInfo.innerHTML = '';
    return;
  }
  let totalVol = 0;
  let totalW = 0;
  const rows = document.querySelectorAll('.obj-item');

  meshes.forEach((m, i) => {
    if (!m.userData.volume) m.userData.volume = computeMeshVolume(m);
    const vol = m.userData.volume;
    totalVol += vol;
    // Use per-mesh filament density from 3MF if available, otherwise use global material selector
    const filDensity = m.userData.filament?.density || null;
    const w = estimateWeight(vol, filDensity);
    totalW += w;
    const weightEl = rows[i]?.querySelector('.obj-weight');
    if (weightEl) weightEl.textContent = w >= 1 ? w.toFixed(1) + 'g' : (w * 1000).toFixed(0) + 'mg';
  });

  const totalVolCm3 = totalVol / 1000;
  const weightStr = totalW >= 1 ? totalW.toFixed(1) + ' g' : (totalW * 1000).toFixed(0) + ' mg';

  // Build per-filament weight breakdown if 3MF provides filament data
  let filamentBreakdown = '';
  if (hasFilamentData) {
    const byType = new Map(); // type → { weight, density }
    meshes.forEach(m => {
      const fil = m.userData.filament;
      if (!fil) return;
      const vol = m.userData.volume || 0;
      const w = estimateWeight(vol, fil.density);
      const key = fil.type;
      if (!byType.has(key)) byType.set(key, { weight: 0, density: fil.density, name: fil.name });
      byType.get(key).weight += w;
    });
    for (const [type, info] of byType) {
      const wStr = info.weight >= 1 ? info.weight.toFixed(1) + 'g' : (info.weight * 1000).toFixed(0) + 'mg';
      filamentBreakdown += `<div class="flex justify-between" title="${info.name}"><span class="text-zinc-500">${type}:</span><span class="text-zinc-300">${wStr} (${info.density} g/cm³)</span></div>`;
    }
  }

  weightInfo.innerHTML = `
    <div class="flex justify-between"><span class="text-zinc-500">Volume:</span><span class="text-zinc-300">${totalVolCm3.toFixed(1)} cm³</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">Weight:</span><span class="text-amber-400 font-semibold">${weightStr}</span></div>
    ${filamentBreakdown}
    <div class="flex justify-between"><span class="text-zinc-500">Infill:</span><span class="text-zinc-300">${infillPercent}%</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">Walls:</span><span class="text-zinc-300">${wallCount}× ${nozzleDia}mm</span></div>
  `;
}

function updateModelInfo(plate) {
  let tris = 0, meshCount = 0;
  plate.group.traverse(c => { if(c.isMesh && c.geometry) { meshCount++; const idx = c.geometry.index; tris += idx ? idx.count/3 : (c.geometry.attributes.position?.count||0)/3; }});
  modelInfo.innerHTML = `<div><span class="text-zinc-100">Objects:</span> ${meshCount}</div><div><span class="text-zinc-100">Triangles:</span> ${Math.round(tris).toLocaleString()}</div><div><span class="text-zinc-100">Plates:</span> ${plates.length}</div>`;
}

const loadingBar = document.getElementById('loading-bar');
function showLoading(t, pct) {
  loadingText.textContent = t || 'Loading...';
  loadingOverlay.style.display = 'flex';
  if (pct !== undefined) loadingBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
}
function hideLoading() { loadingOverlay.style.display = 'none'; loadingBar.style.width = '0%'; }

// ─── Material / Weight Controls ───
MATERIALS.forEach((m, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${m.name} (${m.density} g/cm³)`;
  materialSelect.appendChild(opt);
});
materialSelect.onchange = () => {
  selectedMaterialIdx = parseInt(materialSelect.value);
  if (plates.length) updateObjectsPanel(plates[activePlateIndex]);
};

document.getElementById('infill-slider').oninput = function() {
  infillPercent = parseInt(this.value);
  document.getElementById('infill-val').textContent = infillPercent + '%';
  if (plates.length) updateObjectsPanel(plates[activePlateIndex]);
};

document.getElementById('walls-slider').oninput = function() {
  wallCount = parseInt(this.value);
  document.getElementById('walls-val').textContent = wallCount;
  if (plates.length) updateObjectsPanel(plates[activePlateIndex]);
};

// ─── Raycaster: click-to-select objects on canvas ───
let _downX = 0, _downY = 0;
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  _downX = e.clientX; _downY = e.clientY;
});
canvas.addEventListener('pointerup', (e) => {
  if (e.button !== 0) return;
  // Ignore if dragged more than 5px (orbit control)
  if (Math.abs(e.clientX - _downX) + Math.abs(e.clientY - _downY) > 5) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (!plates.length) return;
  const plate = plates[activePlateIndex];
  const meshes = [];
  plate.group.traverse(c => { if (c.isMesh) meshes.push(c); });
  const hits = raycaster.intersectObjects(meshes, false);
  selectMesh(hits.length > 0 ? hits[0].object : null);
});

// ─── Events ───
document.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
document.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
document.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const f = e.dataTransfer?.files[0];
  if (f && f.name.toLowerCase().endsWith('.3mf')) load3MF(f);
});

document.getElementById('browse-btn').onclick = () => fileInput.click();
openBtn.onclick = () => fileInput.click();
fileInput.onchange = e => { const f = e.target.files[0]; if(f) load3MF(f); fileInput.value = ''; };

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setCameraView(b.dataset.view));
document.getElementById('btn-reset').onclick = () => { if(plates.length) fitCameraToGroup(plates[activePlateIndex].group); };

document.getElementById('btn-layflat').onclick = function() {
  if (!modelGroup || plates.length === 0) return;
  // Lay flat all meshes on the active plate, then re-ground them
  const plate = plates[activePlateIndex];
  layFlatGroup(plate.group);
  // Re-ground each mesh at Y=0
  plate.group.children.forEach(c => {
    if (!c.isMesh || !c.geometry) return;
    c.updateMatrixWorld(true);
    if (!c.geometry.boundingBox) c.geometry.computeBoundingBox();
    const box = c.geometry.boundingBox.clone().applyMatrix4(c.matrixWorld);
    c.position.y -= box.min.y;
  });
  fitCameraToGroup(plate.group);
};

document.getElementById('btn-layout').onclick = function() {
  if (!modelGroup || plates.length === 0) return;
  autoLayoutPlates();
  plates.forEach(p => { p.colors = getColors(p.group); });
  activePlateIndex = 0;
  showPlate(0);
  updateUI(modelNameText.textContent + '.3mf');
};

document.getElementById('btn-bed').onclick = function() {
  bedVisible = !bedVisible;
  if(bedGroup) bedGroup.visible = bedVisible;
  this.classList.toggle('active', bedVisible);
};

document.getElementById('btn-wireframe').onclick = function() {
  wireframeMode = !wireframeMode;
  this.classList.toggle('active', wireframeMode);
  if(modelGroup) modelGroup.traverse(c => { if(c.isMesh && c.material) c.material.wireframe = wireframeMode; });
};

// "Open in Bambu Studio" — store file in SW cache, serve via URL, open via protocol handler
document.getElementById('bambu-btn').onclick = async function() {
  if (!loadedFile) return;
  const btn = this;
  btn.textContent = 'Opening...';
  try {
    const buffer = await loadedFile.arrayBuffer();
    const sw = navigator.serviceWorker?.controller;
    if (sw) {
      // Store file in service worker cache and get a servable URL
      const fileUrl = await new Promise((resolve, reject) => {
        const handler = e => {
          if (e.data?.type === '3MF_STORED') {
            navigator.serviceWorker.removeEventListener('message', handler);
            resolve(e.data.url);
          }
        };
        navigator.serviceWorker.addEventListener('message', handler);
        sw.postMessage({ type: 'STORE_3MF', buffer, fileName: loadedFile.name });
        setTimeout(() => reject(new Error('timeout')), 3000);
      });
      // Launch Bambu Studio via protocol handler with the servable URL
      window.location.href = `bambustudio://open?file=${encodeURIComponent(fileUrl)}`;
    } else {
      // No service worker — fall back to just trying the protocol
      window.location.href = 'bambustudio://open';
    }
  } catch (e) {
    console.warn('Bambu Studio launch failed:', e);
  }
  setTimeout(() => {
    btn.innerHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M9 12l2 2 4-4"/></svg> Bambu Studio`;
  }, 1500);
};

document.addEventListener('keydown', e => {
  const k = e.key;
  if(k==='r') document.getElementById('btn-reset').click();
  if(k==='w') document.getElementById('btn-wireframe').click();
  if(k==='b') document.getElementById('btn-bed').click();
  if(k==='f') document.getElementById('btn-layflat').click();
  if(k==='l') document.getElementById('btn-layout').click();
  if(k==='1') setCameraView('front');
  if(k==='2') setCameraView('back');
  if(k==='3') setCameraView('left');
  if(k==='4') setCameraView('right');
  if(k==='5') setCameraView('top');
  if(k==='6') setCameraView('bottom');
  if(k==='[' && plates.length>1) showPlate(Math.max(0, activePlateIndex-1));
  if(k===']' && plates.length>1) showPlate(Math.min(plates.length-1, activePlateIndex+1));
});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ─── Boot ───
initScene();
</script>
